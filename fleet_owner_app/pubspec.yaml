name: drav_yantra_app
description: DravYantra Mobile App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  fl_chart: ^0.68.0
  lucide_icons: ^0.257.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  go_router: ^14.0.0
  google_fonts: ^6.2.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.1.0
  http: ^1.2.1
  video_player: ^2.8.2
  shared_preferences: ^2.3.3
  csv: ^6.0.0
  path_provider: ^2.1.5
  file_picker: ^8.0.0+1
  supabase_flutter: ^2.5.0
  google_sign_in: ^6.2.2
  pdf: ^3.11.3
  printing: ^5.14.3
  share_plus: ^7.2.1
  flutter_animate: ^4.5.2
  permission_handler: ^11.3.1
  file_saver: ^0.2.14
  mobile_scanner: ^6.0.11

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/dravlogo.jpeg"
  min_sdk_size: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
